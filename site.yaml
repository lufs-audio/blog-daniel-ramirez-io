schema_version: 1
site_id: blog-daniel-ramirez-io
canonical_url: https://blog.daniel-ramirez.io
source:
  repository: danialrami/blog-daniel-ramirez-io
  production_ref: main
build:
  command: npm run build
  output_dir: dist
  toolchain:
    node: "22"
    package_manager: "npm"
  lockfiles:
    - package-lock.json
runtime:
  kind: static
  index: index.html
  error_document: 404.html
  spa_fallback: false
  max_asset_bytes: 26214400
routes:
  required:
    - /
    - /posts/
    - /posts/index.xml
    - /about/
    - /resources/
# The blog has NO required external service origins (unlike the catalog's media API).
# These are informational embeds only (iframes); the site renders fine without them.
external_origins:
  - id: echobridge-embed
    url: https://echobridge.lufs.audio
    required: false
  - id: albumdujour-embed
    url: https://www.albumdujour.lufs.audio
    required: false
domains:
  - blog.daniel-ramirez.io
release:
  # CI publishes the verified artifact to the agnostic `site` branch; any host
  # (Hostinger git-deploy or Cloudflare Pages) consumes it as a swappable adapter.
  artifact_name: site.tar.gz
  publish_branch: site
  retain: 20
verification:
  content_probe: /index.html
  smoke_timeout_seconds: 10
