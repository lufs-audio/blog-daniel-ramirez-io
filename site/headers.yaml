# Provider-neutral header intent, translated per host adapter (Cloudflare _headers,
# nginx add_header, Caddy header, S3 object metadata, ...).
headers:
  # Content-hashed Astro assets are safe to cache forever.
  - path: /_astro/*
    values:
      Cache-Control: public, max-age=31536000, immutable
  # HTML entry points must revalidate so new deploys are seen promptly.
  - path: /*.html
    values:
      Cache-Control: no-cache
      X-Content-Type-Options: nosniff
  - path: /
    values:
      Cache-Control: no-cache
      X-Content-Type-Options: nosniff
